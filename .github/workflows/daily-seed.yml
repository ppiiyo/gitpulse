name: Daily seed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITPULSE_GITHUB_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seed repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_GITHUB_TOKEN || github.token }}
        run: node scripts/seed-repos.mjs

      - name: Seed developers
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_GITHUB_TOKEN || github.token }}
        run: node scripts/seed-developers.mjs

      - name: Commit and push snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_GITHUB_TOKEN || github.token }}
        run: |
          git config user.name "gitpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: daily snapshots $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
